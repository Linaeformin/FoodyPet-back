# deploy workflow
name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Spring Boot project
        run: ./gradlew clean build -x test

      - name: Copy jar to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/app"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/app

            mkdir -p /home/ubuntu/app/logs

            echo "Stopping old application..."
            pkill -f "java -jar .*foodypet.*\.jar" || true

            echo "Finding jar file..."
            JAR_NAME=$(ls /home/ubuntu/app/build/libs/*.jar | grep -v plain | head -n 1)

            echo "Selected jar: $JAR_NAME"

            echo "Loading environment variables..."
            set -a
            source /home/ubuntu/app/.env
            set +a

            echo "Starting application..."
            nohup java -jar "$JAR_NAME" > /home/ubuntu/app/logs/app.log 2>&1 &

            sleep 5

            echo "Checking application process..."
            pgrep -f "java -jar .*foodypet.*\.jar" || true

            echo "Deploy finished."
