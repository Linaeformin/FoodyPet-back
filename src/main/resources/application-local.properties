spring.application.name=foodypet
spring.config.import=optional:file:.env[.properties]

# mysql - local
spring.datasource.url=jdbc:mysql://localhost:3306/foodypet?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=alkaid0319
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# jpa
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql=trace
spring.jpa.hibernate.ddl-auto=update

# redis - local
spring.data.redis.host=localhost
spring.data.redis.port=6379

# jwt
app.jwt.access-exp-min=15
app.jwt.refresh-exp-day=14
jwt.secret=change-this-to-a-very-long-random-secret-at-least-256-bits
jwt.access-exp-millis=900000
jwt.refresh-exp-millis=604800000

# aws s3
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
cloud.aws.region.static=${AWS_REGION}